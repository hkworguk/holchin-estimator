# Holchin software estimation model
# tree: groups (type: group, children) and components (type: component, attributes).
# Three-point values are {low, likely, high}. 'settings' overrides model defaults.
project:
  name: Satelite Upgrade
  description: Example estimate for the Holchin estimator.
  version: 1
settings:
  currency: "£"
  labour_rate_per_hour: 120
  hours_per_pm: 152
  effort: {A: 2.94, B: 1.1}
  schedule: {C: 3.67, D: 0.318}
  adaptation_weights: {design: 0.4, code: 0.3, integration: 0.3}
  sizing: {sloc_per_requirement: 120, sloc_per_use_case: 900}
  monte_carlo: {iterations: 3000, seed: 1234, correlation: 0.3}
  maturity:
    - name: Concept / Proposal
      growth_new: {low: 20, likely: 55, high: 100}
      growth_reused: {low: 10, likely: 30, high: 60}
    - name: SRR
      growth_new: {low: 15, likely: 40, high: 80}
      growth_reused: {low: 8, likely: 25, high: 50}
    - name: SDR / SFR
      growth_new: {low: 10, likely: 30, high: 60}
      growth_reused: {low: 5, likely: 18, high: 40}
    - name: PDR
      growth_new: {low: 5, likely: 20, high: 45}
      growth_reused: {low: 3, likely: 12, high: 30}
    - name: CDR
      growth_new: {low: 3, likely: 12, high: 30}
      growth_reused: {low: 2, likely: 8, high: 20}
    - name: TRR / Code complete
      growth_new: {low: 0, likely: 5, high: 15}
      growth_reused: {low: 0, likely: 3, high: 10}
    - name: Delivered
      growth_new: {low: 0, likely: 0, high: 0}
      growth_reused: {low: 0, likely: 0, high: 0}
  languages:
    - {name: C, effort_factor: 1}
    - {name: C++, effort_factor: 1}
    - {name: "C#", effort_factor: 0.95}
    - {name: Java, effort_factor: 0.95}
    - {name: Python, effort_factor: 0.9}
    - {name: JavaScript / TypeScript, effort_factor: 0.95}
    - {name: Ada, effort_factor: 1.05}
    - {name: Rust, effort_factor: 1}
    - {name: Go, effort_factor: 0.92}
    - {name: Fortran, effort_factor: 1.05}
    - {name: SQL, effort_factor: 0.85}
    - {name: VHDL / Verilog, effort_factor: 1.2}
    - {name: Assembly, effort_factor: 1.4}
    - {name: Other, effort_factor: 1}
  multipliers:
    complexity:
      label: Product complexity
      default: Nominal
      options:
        Very Low: 0.73
        Low: 0.87
        Nominal: 1
        High: 1.17
        Very High: 1.34
        Extra High: 1.74
    reliability:
      label: Required reliability
      default: Nominal
      options:
        Very Low: 0.82
        Low: 0.92
        Nominal: 1
        High: 1.1
        Very High: 1.26
    team_capability:
      label: Team capability
      default: Nominal
      options:
        Very Low: 1.34
        Low: 1.15
        Nominal: 1
        High: 0.88
        Very High: 0.76
    platform_volatility:
      label: Platform volatility
      default: Nominal
      options: {Low: 0.87, Nominal: 1, High: 1.15, Very High: 1.3}
    process_maturity:
      label: Process maturity (CMMI)
      default: Level 3
      options:
        Level 1: 1.2
        Level 2: 1.08
        Level 3: 1
        Level 4: 0.93
        Level 5: 0.87
